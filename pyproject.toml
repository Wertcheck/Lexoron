[project]
name = "kanzlei-ai"
version = "0.1.0"
description = "Konfigurierbare KI-gestuetzte Workflow-Plattform fuer eine Anwaltskanzlei (Prototyp)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kanzlei AI Projekt" }]

# Bewusst minimal fuer Prompt 02-10. Ab Prompt 11 kommt lokale semantische
# Suche hinzu. "fastembed" (ONNX-Runtime-basiert) statt
# "sentence-transformers", da letzteres transitiv volles PyTorch inkl.
# NVIDIA-CUDA-Bibliotheken mitinstalliert (mehrere GB, GPU-Support wird
# hier nie gebraucht - reine CPU-Inferenz reicht für Embeddings). fastembed
# nutzt das groessere Modell paraphrase-multilingual-mpnet-base-v2 (bessere
# Qualitaet, ~1 GB), nur als schlankes ONNX-Modell ohne
# Trainings-Framework-Overhead. Mail- und LLM-Abhaengigkeiten kommen erst
# in den jeweils zustaendigen spaeteren Prompts (17 ...) hinzu.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "watchdog>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
