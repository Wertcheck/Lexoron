[project]
name = "kanzlei-ai"
version = "0.1.0"
description = "Konfigurierbare KI-gestuetzte Workflow-Plattform fuer eine Anwaltskanzlei (Prototyp)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kanzlei AI Projekt" }]

# Bewusst minimal fuer Prompt 02-16 + Privacy-Architektur Schritt 1-4.
# Ab Schritt 5 (Claude-API-Anbindung) kommt das offizielle Anthropic-SDK
# hinzu - ausschliesslich fuer die Textproduktions-Schicht
# (ClaudeWritingProvider), niemals fuer lokale Analyse.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "watchdog>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "fastembed>=0.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
