{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}
  <div class="topbar">
    <h1 class="topbar__title">Passwort ändern</h1>
    {% if forced %}
      <div class="topbar__meta">
        Aus Sicherheitsgründen müssen Sie vor der weiteren Nutzung ein neues Passwort vergeben.
      </div>
    {% endif %}
  </div>

  {% if error %}
    <div class="banner banner--error">{{ error }}</div>
  {% endif %}

  <div class="draft-page">
    <div class="instructions-panel" style="max-width: 420px;">
      <form method="post" action="/dashboard/change-password" class="dashboard-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label class="form-label">
          Aktuelles Passwort
          <input type="password" name="current_password" required />
        </label>
        <label class="form-label">
          Neues Passwort (mind. 10 Zeichen)
          <input type="password" name="new_password" required minlength="10" />
        </label>
        <label class="form-label">
          Neues Passwort bestätigen
          <input type="password" name="new_password_confirm" required minlength="10" />
        </label>
        <button type="submit" class="btn btn--primary">Passwort ändern</button>
      </form>
    </div>
  </div>
{% endblock %}
