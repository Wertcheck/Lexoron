{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}{{ placeholder_title }}{% endblock %}
{% block content %}
  <div class="topbar">
    <h1 class="topbar__title">{{ placeholder_title }}</h1>
  </div>
  <div class="placeholder-page">
    <div class="placeholder-box">
      {{ icons.clock(class_="placeholder-box__icon") }}
      <span class="tag tag--matched placeholder-box__badge">v0.2.0</span>
      <h2 class="placeholder-box__title">In Vorbereitung</h2>
      <p class="placeholder-box__text">{{ placeholder_description }}</p>
    </div>
  </div>
{% endblock %}
